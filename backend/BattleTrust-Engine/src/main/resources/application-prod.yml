server:
  port: 8080

app:
  media:
    provider: ${MEDIA_PROVIDER:cloudinary}
    storage-directory: ${MEDIA_STORAGE_DIRECTORY:/var/lib/battletrust/uploads}
    public-path: ${MEDIA_PUBLIC_PATH:/media}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    issuer: ${JWT_ISSUER:battletrust-engine}
  auth:
    cookie-secure: true
    allowed-origin: ${APP_WEB_ORIGIN}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  escrow:
    winners-percent: ${ESCROW_WINNERS_PERCENT:85.00}
    leader-percent: ${ESCROW_LEADER_PERCENT:10.00}
    platform-percent: ${ESCROW_PLATFORM_PERCENT:5.00}
  wallet:
    minimum-withdrawal: ${WALLET_MINIMUM_WITHDRAWAL:100.00}
    maximum-withdrawal: ${WALLET_MAXIMUM_WITHDRAWAL:1000000.00}
  challenges:
    min-matches-played: ${CHALLENGE_MIN_MATCHES_PLAYED:3}
    min-reputation-score: ${CHALLENGE_MIN_REPUTATION_SCORE:50}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
